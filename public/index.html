<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Homework Manager</title>
    <!-- SDK JS de Supabase pour l'authentification front-end -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .homework { background: #f4f4f4; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        form { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        input, button, select { padding: 8px; font-size: 16px; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; border-radius: 4px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; }
        .auth-bar { background: #eef2f7; padding: 10px; border-radius: 5px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="header-bar">
        <h1 id="ui-title">📚 Homework Manager</h1>
        <div>
            <label for="lang-select" id="ui-lang-label">Language: </label>
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
            </select>
        </div>
    </div>

    <!-- Barre d'authentification -->
    <div class="auth-bar" id="auth-container">
        <div id="user-info" style="display: none;">
            <span id="ui-connected">Connecté :</span> <span id="user-email"></span> 
            <button onclick="logout()" style="background: #ff4d4f; padding: 4px 8px;" id="ui-btn-logout">Déconnexion</button>
        </div>
        <div id="auth-forms" style="display: flex; gap: 10px; width: 100%;">
            <input type="email" id="email" placeholder="Email" style="flex:1;">
            <input type="password" id="password" placeholder="Mot de passe" style="flex:1;">
            <button type="button" onclick="login()" id="ui-btn-login">Se connecter</button>
            <button type="button" onclick="signup()" style="background: #52c41a;" id="ui-btn-signup">S'inscrire</button>
        </div>
    </div>

    <form id="form-homework">
        <input type="text" id="title" placeholder="Homework title" required>
        <input type="text" id="subject" placeholder="Subject" required>
        <input type="date" id="due_date" required>
        <button type="submit" id="ui-btn-submit">Add Homework</button>
    </form>

    <h2 id="ui-subtitle">Homework List</h2>
    <div id="list-homeworks">Loading...</div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // --- LANGUAGE PACKS SYSTEM ---
        const translations = {
            en: {
                title: "📚 Homework Manager",
                langLabel: "Language: ",
                placeholderTitle: "Homework title",
                placeholderSubject: "Subject",
                btnSubmit: "Add Homework",
                subtitle: "Homework List",
                loading: "Loading...",
                noHomeworks: "No homeworks yet!",
                dueDateText: "Due date:",
                btnDelete: "Delete",
                connectedText: "Connected as:",
                btnLogout: "Logout",
                btnLogin: "Login",
                btnSignup: "Sign up",
                loginAlert: "You must be logged in to add homework!"
            },
            fr: {
                title: "📚 Gestionnaire de Devoirs",
                langLabel: "Langue : ",
                placeholderTitle: "Titre du devoir",
                placeholderSubject: "Matière",
                btnSubmit: "Ajouter le devoir",
                subtitle: "Liste des devoirs",
                loading: "Chargement...",
                noHomeworks: "Aucun devoir pour le moment !",
                dueDateText: "Pour le :",
                btnDelete: "Supprimer",
                connectedText: "Connecté en tant que :",
                btnLogout: "Déconnexion",
                btnLogin: "Se connecter",
                btnSignup: "S'inscrire",
                loginAlert: "Vous devez être connecté pour ajouter un devoir !"
            },
            es: {
                title: "📚 Gestor de tareas",
                langLabel: "Idioma: ",
                placeholderTitle: "Título de la tarea",
                placeholderSubject: "Asignatura",
                btnSubmit: "Añadir tarea",
                subtitle: "Lista de tareas",
                loading: "Cargando...",
                noHomeworks: "¡No hay tareas por el momento!",
                dueDateText: "Para el:",
                btnDelete: "Eliminar",
                connectedText: "Conectado como:",
                btnLogout: "Cerrar sesión",
                btnLogin: "Iniciar sesión",
                btnSignup: "Registrarse",
                loginAlert: "¡Debes iniciar sesión para añadir una tarea!"
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-lang-label').innerText = t.langLabel;
            document.getElementById('title').placeholder = t.placeholderTitle;
            document.getElementById('subject').placeholder = t.placeholderSubject;
            document.getElementById('ui-btn-submit').innerText = t.btnSubmit;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('ui-connected').innerText = t.connectedText;
            document.getElementById('ui-btn-logout').innerText = t.btnLogout;
            document.getElementById('ui-btn-login').innerText = t.btnLogin;
            document.getElementById('ui-btn-signup').innerText = t.btnSignup;
            
            loadHomeworks();
        }

        // --- AUTHENTIFICATION ---
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            updateAuthUI(session);
        }

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('Inscription réussie !');
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else checkUser();
        }

        async function logout() {
            await supabase.auth.signOut();
            checkUser();
        }

        function updateAuthUI(session) {
            const userInfo = document.getElementById('user-info');
            const authForms = document.getElementById('auth-forms');
            if (session) {
                userInfo.style.display = 'block';
                authForms.style.display = 'none';
                document.getElementById('user-email').innerText = session.user.email;
            } else {
                userInfo.style.display = 'none';
                authForms.style.display = 'flex';
            }
        }

        // --- APP LOGIC (Via ton API backend) ---
        async function loadHomeworks() {
            const t = translations[currentLang];
            const container = document.getElementById('list-homeworks');
            container.innerHTML = t.loading;

            try {
                // Appel de ton API (publique pour le GET)
                const res = await fetch('/api/homeworks');
                const homeworks = await res.json();
                
                if (!Array.isArray(homeworks) || homeworks.length === 0) {
                    container.innerHTML = `<p>${t.noHomeworks}</p>`;
                    return;
                }

                container.innerHTML = homeworks.map(h => `
                    <div class="homework" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>${escapeHtml(h.subject)}</strong>: ${escapeHtml(h.title)} (${t.dueDateText} ${escapeHtml(h.due_date)})
                        </div>
                        <button onclick="deleteHomework(${h.id})" style="background: #ff4d4f; padding: 4px 8px; font-size: 14px;">${t.btnDelete}</button>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p>Error loading homeworks.</p>';
            }
        }

        document.getElementById('form-homework').addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            const title = document.getElementById('title').value;
            const subject = document.getElementById('subject').value;
            const due_date = document.getElementById('due_date').value;

            // Récupère la session active pour l'envoyer à l'API
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                alert(t.loginAlert);
                return;
            }

            await fetch('/api/homeworks', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${session.access_token}` // Envoie le jeton de sécurité
                },
                body: JSON.stringify({ title, subject, due_date, user_id: session.user.id })
            });

            document.getElementById('form-homework').reset();
            loadHomeworks();
        });

        async function deleteHomework(id) {
            const { data: { session } } = await supabase.auth.getSession();
            
            const headers = {};
            if (session) {
                headers['Authorization'] = `Bearer ${session.access_token}`;
            }

            const res = await fetch(`/api/homeworks?id=${id}`, {
                method: 'DELETE',
                headers: headers
            });

            if (!res.ok) {
                alert("Impossible de supprimer ce devoir (vérifiez que vous en êtes l'auteur).");
            }
            
            loadHomeworks();
        }

        // Initial load
        checkUser();
        loadHomeworks();
    </script>
</body>
</html>
